# mdBook configuration of the documentation site (docs.nexmap.net).
# The pages live in ../docs; this directory only holds the site tooling, so
# none of it ends up on the site. See CONTRIBUTING.md, "Documentation site".

[book]
title = "Nexmap documentation"
language = "en"
src = "../docs"

[build]
# A page missing from docs/ is a mistake in SUMMARY.md, not a page to create.
create-missing = false

[output.html]
# No git-repository-url: the repository is private, so readers could not open it.
# Version switcher, the banner on unreleased docs and the sidebar logo;
# theme/favicon.svg replaces mdBook's icon. build.sh copies the
# current versions of these files into every version it builds.
additional-css = ["theme/version.css", "theme/logo.css"]
additional-js = ["theme/version.js", "theme/logo.js"]
