# Serves the documentation site built by build.sh. Replaces the image's
# default server; the unprivileged image listens on 8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind Coolify's proxy: keep redirects (e.g. /latest -> /latest/)
    # relative, so they never point at the container's own host and port.
    absolute_redirect off;

    # Lists the versions; must never be cached past a deployment.
    location = /versions.json {
        add_header Cache-Control "no-cache";
    }

    # Each version has its own 404 page, styled and linked for that version.
    location ~ ^/([^/]+)/ {
        try_files $uri $uri/ =404;
        error_page 404 /$1/404.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /latest/404.html;
}
