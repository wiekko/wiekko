# Serves the download site (site/Dockerfile). Replaces the image's default
# server; the unprivileged image listens on 8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Behind Coolify's proxy: keep redirects (e.g. /releases/v1.0.0 ->
    # /releases/v1.0.0/) relative, so they never name the container's port.
    absolute_redirect off;

    # www.nexmap.net -> nexmap.net
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # Temporary files of the entrypoint hook, and anything else hidden.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Install scripts: plain text, so browsers show rather than download them.
    location ~ ^/install\.(sh|ps1)$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Changes with every release.
    location = /releases/latest.json {
        alias /data/releases/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    location = /releases/ {
        alias /data/releases/;
        autoindex on;
        add_header Cache-Control "no-cache";
    }

    # A published release never changes.
    location ~ ^/releases/(v[^/]+)/SHA256SUMS$ {
        alias /data/releases/$1/SHA256SUMS;
        default_type text/plain;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /releases/ {
        alias /data/releases/;
        autoindex on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
